- insert:
    - id: dsh-codex-workflow
      name: 'dsh-codex-workflow'
      config:
        codexCommand: codex
        autoTriggerMode: complex
        plannerModel: ''
        reviewerModel: ''
        plannerEffort: high
        reviewerEffort: high
        maxReviewCycles: 3
        maxNoChangeReviewRounds: 1
        reviewDiffMaxBytes: 65536
        bridgePollMs: 1000
        callbackTimeoutMs: 600000
        callbackMaxAttempts: 3
        callbackRetryBaseMs: 2000
        # 1.1.1 transient upstream retry (server_overloaded / at capacity / 429 /
        # 5xx / dropped streams / a writer held elsewhere). Budget 0 disables it.
        transientRetryBaseMs: 3000
        transientRetryMaxMs: 60000
        transientRetryBudgetMs: 1200000
        transientRetryJitterRatio: 0.25
        turnTimeoutMs: 600000
        idleProcessMs: 5000
        terminalRelayTimeoutMs: 60000
        openCodexDesktopOnReview: true
        desktopOpenRetryBaseMs: 2000
        desktopOpenRetryMaxMs: 60000

name: release-verification

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - src/**
      - scripts/**
      - SKILL.md
      - references/**
      - .github/workflows/release-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CODEX_WORKFLOW_TEST_CONCURRENCY: '2'
      CODEX_WORKFLOW_TEST_REPORTER: tap
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install pinned development dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - name: Run complete isolated release gate twice
        run: pnpm verify:isolated
      - name: Publish verified Skill artifacts
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE) '.codex-workflow-verification'
          $runs = @(Get-ChildItem -LiteralPath $evidenceRoot -Directory -Filter 'isolated-*')
          if ($runs.Count -ne 1) { throw 'Expected one isolated verification run' }
          $summary = Get-Content -LiteralPath (Join-Path $runs[0].FullName 'summary.json') -Raw | ConvertFrom-Json
          if ($summary.complete -ne $true) { throw 'Incomplete gate cannot produce release artifacts' }
          $skill = Join-Path $summary.stageDirectory 'dist/codex-workflow'
          if (!(Test-Path -LiteralPath (Join-Path $skill 'SKILL.md'))) { throw 'Verified Skill is missing' }
          Copy-Item -LiteralPath $skill -Destination (Join-Path $env:RUNNER_TEMP 'codex-workflow') -Recurse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-${{ github.sha }}
          path: |
            ${{ github.workspace }}/../.codex-workflow-verification/
            !${{ github.workspace }}/../.codex-workflow-verification/**/snapshot/**
            ${{ runner.temp }}/codex-workflow/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

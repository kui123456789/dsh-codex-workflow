name: ci

on:
  push:
    branches: [main, master, 'feature/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CODEX_WORKFLOW_TEST_CONCURRENCY: '2'
      CODEX_WORKFLOW_TEST_REPORTER: tap
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.x', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify standalone Skill and native test receipts
        run: pnpm release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ github.workspace }}/../.codex-workflow-verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
